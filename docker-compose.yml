services:
  # ============================================================================
  # 1. PostgreSQL Database Isolated Instances
  # ============================================================================
  postgres-products:
    image: postgres:16-alpine
    container_name: luna-postgres-products
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_PRODUCTS_DB:-luna_products}
    ports:
      - "${POSTGRES_PRODUCTS_PORT:-5434}:5432"
    volumes:
      - postgres-products-data:/var/lib/postgresql/data
      - ./Luna-platform/db/ddls/1. products.sql:/docker-entrypoint-initdb.d/01-ddl.sql:ro
      - ./Luna-platform/db/dmls/1. products-seed.sql:/docker-entrypoint-initdb.d/02-dml.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_PRODUCTS_DB:-luna_products}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - luna-network

  postgres-users:
    image: postgres:16-alpine
    container_name: luna-postgres-users
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_USERS_DB:-luna_users}
    ports:
      - "${POSTGRES_USERS_PORT:-5435}:5432"
    volumes:
      - postgres-users-data:/var/lib/postgresql/data
      - ./Luna-platform/db/ddls/2. users.sql:/docker-entrypoint-initdb.d/01-ddl.sql:ro
      - ./Luna-platform/db/dmls/2. users-seed.sql:/docker-entrypoint-initdb.d/02-dml.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_USERS_DB:-luna_users}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - luna-network

  postgres-orders:
    image: postgres:16-alpine
    container_name: luna-postgres-orders
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_ORDERS_DB:-luna_orders}
    ports:
      - "${POSTGRES_ORDERS_PORT:-5436}:5432"
    volumes:
      - postgres-orders-data:/var/lib/postgresql/data
      - ./Luna-platform/db/ddls/3. orders.sql:/docker-entrypoint-initdb.d/01-ddl.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_ORDERS_DB:-luna_orders}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - luna-network

  # ============================================================================
  # 2. Spring Boot Microservices
  # ============================================================================
  product-service:
    container_name: luna-product-service
    build:
      context: .
      dockerfile: product-service/Dockerfile
    restart: unless-stopped
    ports:
      - "${PRODUCT_SERVICE_PORT:-8082}:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres-products:5432/${POSTGRES_PRODUCTS_DB:-luna_products}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres-products:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - luna-network

  user-service:
    container_name: luna-user-service
    build:
      context: .
      dockerfile: user-service/Dockerfile
    restart: unless-stopped
    ports:
      - "${USER_SERVICE_PORT:-8081}:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres-users:5432/${POSTGRES_USERS_DB:-luna_users}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    depends_on:
      postgres-users:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - luna-network

  order-service:
    container_name: luna-order-service
    build:
      context: .
      dockerfile: order-service/Dockerfile
    restart: unless-stopped
    ports:
      - "${ORDER_SERVICE_PORT:-8083}:8083"
    environment:
      DB_URL: jdbc:postgresql://postgres-orders:5432/${POSTGRES_ORDERS_DB:-luna_orders}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PRODUCT_SERVICE_URL: http://product-service:8082
    depends_on:
      postgres-orders:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - luna-network

  # ============================================================================
  # 3. API Gateway
  # ============================================================================
  luna-gateway:
    container_name: luna-gateway
    build:
      context: .
      dockerfile: luna-gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - luna-network

  # ============================================================================
  # 4. Frontend Client (React SPA & Nginx)
  # ============================================================================
  frontend:
    container_name: luna-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_DEV_PORT:-5173}:80"
    depends_on:
      luna-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - luna-network

# ==============================================================================
# Persistent Volumes & Network
# ==============================================================================
volumes:
  postgres-products-data:
    driver: local
  postgres-users-data:
    driver: local
  postgres-orders-data:
    driver: local

networks:
  luna-network:
    driver: bridge
