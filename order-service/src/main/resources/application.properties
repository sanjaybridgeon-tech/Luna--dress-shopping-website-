# Server Configuration
server.port=${PORT:8083}

# Application Configuration
spring.application.name=order-service

# DataSource Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/luna_orders}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:sanjaysr@29}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inter-Service Feign URLs & HTTP Client
services.product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8082}
spring.cloud.openfeign.httpclient.hc5.enabled=true

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
