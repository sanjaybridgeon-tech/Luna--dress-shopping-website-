# Server Configuration
server.port=${PORT:8080}

# Application Configuration
spring.application.name=luna-gateway

# Global CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[0]=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[1]=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[2]=http://localhost:80
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[3]=http://localhost
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[3]=PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[4]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[5]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Route 0: User Service (Auth, Account Profile & Addresses, Users)
spring.cloud.gateway.routes[0].id=user-service-route
spring.cloud.gateway.routes[0].uri=${USER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**, /api/account/**, /api/users/**

# Route 1: Product Service (Products Catalog, Categories, Stock Adjustments)
spring.cloud.gateway.routes[1].id=product-service-route
spring.cloud.gateway.routes[1].uri=${PRODUCT_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/products/**, /api/categories/**

# Route 2: Order Service (Checkout, Customer Orders, Admin Order Management)
spring.cloud.gateway.routes[2].id=order-service-route
spring.cloud.gateway.routes[2].uri=${ORDER_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/orders/**, /api/admin/orders/**

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,gateway
